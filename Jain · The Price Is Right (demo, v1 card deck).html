<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jain · The Price Is Right (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --nav:#233038; --nav-line:#3a4a52; --nav-text:#ffffff;
  --bg:#f8f9f8; --surface:#ffffff; --surface-2:#fbfbfa; --border:#e7e6e3; --border-strong:#d6d5d1;
  --text:#1e1d1a; --muted:#6b6b68; --faint:#9b9a96;
  --teal:#447c86; --teal-strong:#366670; --on-teal:#ffffff; --teal-tint:#f3f8f9; --teal-border:#c9dfe2; --teal-text:#3c6f78;
  --red:#d42020; --red-tint:#fdeeee; --amber:#a86700; --amber-tint:#fdf4de; --green:#2f7d47; --green-tint:#e9f4ec;
  --purple:#7664a3; --purple-tint:#efecf7; --scrim:rgba(20,28,32,.45);
  --shadow-up:0 -6px 24px rgba(20,30,35,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --nav:#161f24; --nav-line:#2c3940; --bg:#12181b; --surface:#1a2226; --surface-2:#1e272c; --border:#2b363b; --border-strong:#38454b;
    --text:#e9edec; --muted:#a4adaf; --faint:#7d888b;
    --teal:#6aa7b1; --teal-strong:#86bcc5; --on-teal:#0f1b1e; --teal-tint:#1b2d31; --teal-border:#2f4c51; --teal-text:#93cad2;
    --red:#f0766c; --red-tint:#3a1f1d; --amber:#e3b35a; --amber-tint:#3a2f17; --green:#6cc08a; --green-tint:#1c3326;
    --purple:#b0a3e6; --purple-tint:#2a2548; --scrim:rgba(0,0,0,.6); --shadow-up:0 -6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --nav:#161f24; --nav-line:#2c3940; --bg:#12181b; --surface:#1a2226; --surface-2:#1e272c; --border:#2b363b; --border-strong:#38454b;
  --text:#e9edec; --muted:#a4adaf; --faint:#7d888b;
  --teal:#6aa7b1; --teal-strong:#86bcc5; --on-teal:#0f1b1e; --teal-tint:#1b2d31; --teal-border:#2f4c51; --teal-text:#93cad2;
  --red:#f0766c; --red-tint:#3a1f1d; --amber:#e3b35a; --amber-tint:#3a2f17; --green:#6cc08a; --green-tint:#1c3326;
  --purple:#b0a3e6; --purple-tint:#2a2548; --scrim:rgba(0,0,0,.6); --shadow-up:0 -6px 24px rgba(0,0,0,.35);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px); height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--text); font-family:Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--teal); outline-offset:2px; border-radius:6px}
svg.i{width:16px; height:16px; flex:none; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round}

/* nav */
.nav{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--nav); color:var(--nav-text); height:44px; display:flex; align-items:center; gap:16px; padding:0 16px}
.logo{display:flex; align-items:center; gap:6px; font-size:20px; font-weight:400; letter-spacing:-.2px}
.logo svg{width:15px; height:15px}
.crumbs{display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; min-width:0; margin-left:12px}
.crumbs button{background:none; border:0; color:#cfd8db; padding:0; cursor:pointer; display:flex; align-items:center; font-weight:500}
.crumbs button:hover{color:#fff}
.crumbs .cur{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.crumbs svg.i{width:14px; height:14px; color:#9fb0b6}
.nav-r{margin-left:auto; display:flex; align-items:center; gap:8px}
.nav-btn{border:1px solid #6c7b82; background:transparent; color:#fff; border-radius:6px; padding:4px 10px; font-size:12.5px; cursor:pointer; white-space:nowrap}
.nav-btn:hover{border-color:#aab7bc}
.who{display:flex; align-items:center; gap:8px; border:1px solid var(--nav-line); border-radius:999px; padding:3px 10px 3px 3px; font-size:13px; font-weight:600}
.avatar{width:22px; height:22px; border-radius:50%; background:#8d8aa6; color:#fff; display:grid; place-items:center; font-size:9.5px; font-weight:700}

/* layout */
.shell{transition:padding-right .2s ease}
.page{max-width:900px; margin:0 auto; padding:28px 24px 200px}
body.chat-open .shell{padding-right:360px}
@media (max-width:1100px){ body.chat-open .shell{padding-right:0} }
.eyebrow{color:var(--teal-text); font-size:11px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; margin:0 0 6px}
h1{font-size:28px; line-height:1.2; font-weight:600; letter-spacing:-.4px; margin:0; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.ver{font-size:11px; font-weight:500; border:1px solid var(--border-strong); color:var(--muted); border-radius:999px; padding:1px 7px; letter-spacing:0}
.sub{color:var(--muted); margin:8px 0 0; max-width:62ch}
.meta{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px 28px; margin:18px 0 0; padding-bottom:18px; border-bottom:1px solid var(--border)}
.meta dt{color:var(--muted); font-size:12.5px; margin-bottom:2px}
.meta dd{margin:0; font-size:13px}
.actions{display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 22px}
.btn{display:inline-flex; align-items:center; gap:6px; border-radius:6px; padding:7px 12px; font-size:13px; font-weight:500; border:1px solid var(--border-strong); background:var(--surface); cursor:pointer; white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--teal); border-color:var(--teal); color:var(--on-teal)}
.btn.primary:hover{background:var(--teal-strong); border-color:var(--teal-strong)}
.btn.ghost{border-color:transparent; background:transparent; color:var(--teal-text)}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.link{background:none; border:0; padding:0; color:var(--teal-text); font-size:12.5px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:5px}
.link:hover{text-decoration:underline}

/* stat cards */
.stats{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; margin-bottom:22px}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px}
.stat .lab{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12.5px}
.ico{width:26px; height:26px; border-radius:6px; display:grid; place-items:center; flex:none}
.ico svg.i{width:15px; height:15px}
.ico.grey{background:#f0efec; color:#6b6b68} .ico.green{background:var(--green-tint); color:var(--green)} .ico.blue{background:#eaf0fb; color:#3d64b8} .ico.red{background:var(--red-tint); color:var(--red)} .ico.teal{background:var(--teal-tint); color:var(--teal)} .ico.purple{background:var(--purple-tint); color:var(--purple)} .ico.amber{background:var(--amber-tint); color:var(--amber)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ico.grey{background:#262f33; color:#a4adaf} :root:not([data-theme="light"]) .ico.blue{background:#1d2840; color:#8fb0ee} }
.stat .val{font-size:24px; font-weight:500; margin:12px 0 2px; letter-spacing:-.3px}
.stat .val small{font-size:17px; color:var(--muted); font-weight:400}
.stat .note{color:var(--muted); font-size:12.5px}
.skel{height:10px; border-radius:4px; background:linear-gradient(90deg, var(--border) 0%, var(--surface-2) 100%); margin:14px 0 8px; width:70%}
.skel.s{width:45%; margin-top:0}

/* sections */
.sec{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px 20px; margin-bottom:14px}
.sec-h{display:flex; align-items:center; gap:10px}
.sec-h h2{font-size:15px; font-weight:600; margin:0}
.sec-h .src{margin-left:auto; color:var(--faint); font-size:12px; white-space:nowrap}
.ic-btn{width:28px; height:28px; border:1px solid var(--border-strong); border-radius:6px; background:var(--surface); display:grid; place-items:center; cursor:pointer; color:var(--muted); flex:none}
.ic-btn:hover{color:var(--teal-text); border-color:var(--teal-border)}
.sec-body{margin-top:14px}
.sec p{margin:0 0 10px}
.lead{font-weight:600; margin:0 0 12px}
.sec.revealed{animation:reveal .5s ease}
@keyframes reveal{from{box-shadow:0 0 0 3px var(--teal-border)} to{box-shadow:0 0 0 0 transparent}}
.locked{display:flex; align-items:center; gap:12px; background:var(--surface-2); border:1px dashed var(--border-strong); border-radius:10px; padding:12px 14px; margin-bottom:10px; color:var(--muted)}
.locked h2{font-size:14px; font-weight:600; margin:0; color:var(--text)}
.locked .why{font-size:12.5px}
.locked .grow{flex:1; min-width:0}
.locked .btn{padding:5px 10px; font-size:12.5px}
.tag{display:inline-block; font-size:11px; font-weight:600; border-radius:999px; padding:1px 7px; border:1px solid; white-space:nowrap}
.tag.proposed{color:var(--purple); border-color:var(--purple-tint); background:var(--purple-tint)}
.tag.high{color:var(--red); border-color:var(--red); background:var(--red-tint)}
.tag.med{color:var(--amber); border-color:var(--amber); background:var(--amber-tint)}
.tag.won{color:var(--green); border-color:transparent; background:var(--green-tint)}
.tag.lost{color:var(--muted); border-color:transparent; background:#efeeeb}
.tag.bidding{color:var(--teal-text); border-color:transparent; background:var(--teal-tint)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag.lost{background:#262f33} }
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:12px; border:1px solid var(--border-strong); border-radius:5px; padding:2px 8px; color:var(--text); background:var(--surface)}
.kv{display:grid; grid-template-columns:200px minmax(0,1fr); gap:10px 18px; font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.rows > div{display:grid; grid-template-columns:170px minmax(0,1fr); gap:16px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px}
.rows > div:last-child{border-bottom:0}
.rows .k{color:var(--muted)}
.hr{height:1px; background:var(--border); margin:14px 0}
.muted{color:var(--muted)} .small{font-size:12.5px}
ul.plain{margin:0; padding-left:16px} ul.plain li{margin:3px 0}

/* tables */
.tbl-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; font-size:13px}
th{text-align:left; font-weight:500; color:var(--muted); font-size:12px; background:var(--surface-2); padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap}
td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top}
tr:last-child td{border-bottom:0}
td.num, th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
tr.hl td{background:var(--amber-tint)}
tr.group td{background:var(--surface-2); font-weight:600}

/* pipeline */
.seg{display:inline-flex; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:4px; margin:20px 0 14px}
.seg button{border:0; background:transparent; padding:6px 12px; border-radius:6px; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal-tint); color:var(--teal-text); font-weight:600}
.pipe{background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden}
.pipe tr.row{cursor:pointer}
.pipe tr.row:hover td{background:var(--surface-2)}
.pipe tr.mystery td{background:var(--teal-tint)}
.pipe tr.mystery:hover td{background:var(--teal-tint)}
.fac{font-weight:600}
.fac-sub{color:var(--muted); font-size:12px; font-weight:400}
.guess-me{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:var(--on-teal); background:var(--teal); border-radius:999px; padding:2px 8px; margin-left:8px; vertical-align:1px}
.row-act{color:var(--teal-text); font-size:12.5px; font-weight:500; display:inline-flex; gap:5px; align-items:center; white-space:nowrap}

/* tray */
.tray{position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--surface); border-top:1px solid var(--border); box-shadow:var(--shadow-up); padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.tray-in{display:flex; align-items:stretch; gap:16px; max-width:1400px; margin:0 auto}
.hand{flex:none; width:128px; display:flex; flex-direction:column; justify-content:center; gap:6px}
.hand .t{font-weight:600; font-size:13px}
.pips{display:flex; gap:6px}
.pip{width:22px; height:30px; border-radius:4px; border:1.5px solid var(--teal); background:var(--teal)}
.pip.used{background:transparent; border-style:dashed; border-color:var(--border-strong)}
.hand .h{font-size:11.5px; color:var(--muted); line-height:1.35}
.cards{flex:1; min-width:0; display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px; scroll-snap-type:x proximity}
.card{flex:none; width:150px; min-height:96px; text-align:left; border:1px solid var(--teal-border); background:var(--surface); border-radius:9px; padding:9px 10px; display:flex; flex-direction:column; gap:4px; cursor:pointer; scroll-snap-align:start; position:relative; transition:transform .12s ease, box-shadow .12s ease}
.card:hover:not([aria-disabled="true"]){transform:translateY(-2px); box-shadow:0 6px 16px rgba(20,30,35,.1)}
.card .top{display:flex; align-items:center; gap:6px; color:var(--teal)}
.card .cost{margin-left:auto; font-size:11px; color:var(--muted); font-weight:500}
.card .nm{font-weight:600; font-size:12.5px; line-height:1.25}
.card .bl{font-size:11.5px; color:var(--muted); line-height:1.3}
.card .ft{margin-top:auto; display:flex; gap:4px; align-items:center; flex-wrap:wrap}
.card.played{background:var(--teal-tint); border-color:var(--teal)}
.card.played .cost{color:var(--teal-text); font-weight:600}
.card.locked-c{border-style:dashed; border-color:var(--border-strong); background:var(--surface-2)}
.card.locked-c .top{color:var(--faint)}
.card.locked-c .nm{color:var(--muted)}
.card.out{opacity:.45}
.req{font-size:11px; color:var(--muted); display:inline-flex; gap:3px; align-items:center}
.req svg.i{width:11px; height:11px}
.tray-r{flex:none; display:flex; flex-direction:column; justify-content:center; gap:6px; align-items:stretch; width:170px}
.tray-r .btn{justify-content:center; padding:10px 12px; font-size:14px}
.locked-note{font-size:12px; color:var(--muted); text-align:center}
.done-bar{flex:1; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.done-bar .big{font-size:18px; font-weight:600}
@media (max-width:720px){
  .page{padding:20px 14px 220px}
  .meta{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:1fr; gap:2px 0} .kv dd{margin-bottom:8px}
  .rows > div{grid-template-columns:1fr; gap:2px}
  .tray-in{flex-wrap:wrap; gap:10px}
  .hand{width:auto; flex-direction:row; align-items:center; gap:10px}
  .hand .h{display:none}
  .tray-r{width:auto; flex:1; order:2; flex-direction:row; justify-content:flex-end}
  .cards{order:3; flex-basis:100%}
  .crumbs .hide-s{display:none}
  .nav-btn.hide-s, .who .nm{display:none}
}

/* chat */
.chat{position:fixed; top:calc(env(safe-area-inset-top,0px) + 44px); right:0; bottom:0; width:360px; z-index:26; background:var(--surface); border-left:1px solid var(--border); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .2s ease; padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
body.chat-open .chat{transform:none}
@media (max-width:720px){ .chat{width:100%; padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))} }
.chat-h{display:flex; align-items:center; padding:12px 14px; font-weight:600; font-size:13px}
.chat-h .ic-btn{margin-left:auto; border:0}
.chat-b{flex:1; overflow-y:auto; padding:6px 14px 10px; display:flex; flex-direction:column; gap:14px}
.msg .who2{font-size:11.5px; font-weight:600; margin-bottom:3px}
.msg .ttl{font-weight:600; font-size:13px; margin-bottom:2px}
.msg .tx{font-size:13px; color:var(--text)}
.msg.you .tx{border:1px solid var(--border-strong); border-radius:8px; padding:8px 10px; background:var(--surface-2)}
.typing{display:inline-flex; gap:4px} .typing span{width:6px; height:6px; border-radius:50%; background:var(--faint); animation:blink 1s infinite} .typing span:nth-child(2){animation-delay:.15s} .typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25} 50%{opacity:1}}
.scope{display:flex; gap:14px; padding:0 14px 8px}
.scope button{background:none; border:0; padding:2px 0; font-size:12px; font-weight:500; color:var(--teal-text); cursor:pointer; border-bottom:1.5px solid transparent}
.scope button[aria-pressed="true"]{border-bottom-color:var(--teal); font-weight:600}
.prompts{padding:0 14px 10px; display:flex; flex-direction:column; gap:6px}
.prompt{display:flex; align-items:center; gap:8px; text-align:left; border:1px solid var(--teal-border); background:var(--teal-tint); color:var(--teal-text); border-radius:8px; padding:8px 10px; font-size:12.5px; cursor:pointer}
.prompt:hover:not([disabled]){border-color:var(--teal)}
.prompt .c{margin-left:auto; font-size:11px; white-space:nowrap; color:var(--muted)}
.prompt[disabled]{opacity:.5; cursor:default}
.chat-in{margin:0 14px 14px; border:1px solid var(--border-strong); border-radius:8px; padding:10px 12px; color:var(--faint); font-size:13px}
.chat-in .row2{display:flex; justify-content:space-between; align-items:center; margin-top:14px}
.send{width:24px; height:24px; border-radius:50%; background:#efeeeb; display:grid; place-items:center; color:var(--muted)}

/* modals */
.scrim{position:fixed; inset:0; z-index:50; background:var(--scrim); display:grid; place-items:center; padding:20px; animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--surface); border-radius:12px; width:min(520px, 100%); max-height:calc(100% - 20px); overflow:auto; box-shadow:0 24px 64px rgba(0,0,0,.25)}
.dlg.wide{width:min(640px,100%)}
.dlg-b{padding:24px}
.dlg h3{font-size:19px; font-weight:600; margin:0 0 6px; letter-spacing:-.2px}
.dlg .f{display:flex; flex-direction:column; gap:5px; margin-top:14px}
.dlg label{font-size:12.5px; color:var(--muted); font-weight:500}
.dlg input[type=text], .dlg input[type=email]{font:inherit; font-size:14px; padding:9px 11px; border:1px solid var(--border-strong); border-radius:7px; background:var(--surface); color:var(--text)}
.dlg input:focus{outline:2px solid var(--teal-border); border-color:var(--teal)}
.dlg-f{display:flex; justify-content:flex-end; gap:8px; padding:14px 24px; background:var(--surface-2); border-top:1px solid var(--border); border-radius:0 0 12px 12px; align-items:center}
.dlg-f .left{margin-right:auto}
.info{background:var(--teal-tint); border:1px solid var(--teal-border); color:var(--teal-text); border-radius:8px; padding:11px 13px; font-size:13px}
.steps{list-style:none; margin:14px 0 0; padding:0; border:1px solid var(--border); border-radius:8px}
.steps li{display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--border); font-size:13px}
.steps li:last-child{border-bottom:0}
.circ{width:18px; height:18px; border-radius:50%; border:1.5px solid var(--border-strong); flex:none; display:grid; place-items:center}
.circ.spin{border-color:var(--teal); border-right-color:transparent; animation:spin .7s linear infinite}
.circ.ok{border-color:var(--green); color:var(--green)} .circ.ok svg.i{width:11px; height:11px; stroke-width:2.5}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:5px; background:var(--border); border-radius:3px; margin-top:16px; overflow:hidden}
.bar i{display:block; height:100%; width:0; background:var(--teal); border-radius:3px; transition:width .35s ease}
.money{display:flex; align-items:center; border:1px solid var(--border-strong); border-radius:8px; padding:0 12px; margin-top:16px; background:var(--surface)}
.money span{font-size:26px; color:var(--muted)}
.money input{flex:1; min-width:0; border:0 !important; outline:none !important; font:inherit; font-size:30px !important; font-weight:600; padding:12px 8px !important; background:transparent !important; color:var(--text); font-variant-numeric:tabular-nums}
.money .per{font-size:14px}

.played-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}

.podium{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px 0 16px}

.back{margin-bottom:14px}

.delta{font-size:12px; font-weight:600} .delta.up{color:var(--green)} .delta.down{color:var(--red)}

.wiz{display:grid; grid-template-columns:260px minmax(0,1fr); min-height:340px}
.wiz-art{background:var(--teal-tint); border-right:1px solid var(--teal-border); border-radius:12px 0 0 0; display:grid; place-items:center; padding:24px}

.wiz-txt .n{font-size:12px; color:var(--teal-text); font-weight:600; margin-bottom:8px}
.wiz-txt h3{font-size:21px}
.wiz-txt p{color:var(--muted); margin:6px 0 0; max-width:44ch}
.wiz-txt ul{margin:12px 0 0; padding-left:18px; color:var(--text); font-size:13.5px} .wiz-txt li{margin:4px 0}
.dots{display:flex; gap:6px; margin-right:auto}

.dots span.on{background:var(--teal); width:18px; border-radius:4px}
.mini-row{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px; width:100%; font-size:12.5px}
.mini-row .fac{font-size:13px}
.mini-row .r2{display:flex; justify-content:space-between; align-items:center; margin-top:8px}
.fan{position:relative; width:190px; height:150px}
.fan .card{position:absolute; top:12px; width:108px; min-height:130px; cursor:default; box-shadow:0 8px 20px rgba(20,30,35,.12)}
.fan .card:hover{transform:none}
.chain{display:flex; flex-direction:column; gap:10px; width:100%}
.chain .ln{display:flex; align-items:center; gap:6px; font-size:12px}
.chain .pill{border-radius:7px; padding:6px 9px; font-weight:600; white-space:nowrap}

@media (max-width:620px){ .wiz{grid-template-columns:1fr} .wiz-art{border-right:0; border-bottom:1px solid var(--teal-border); border-radius:12px 12px 0 0; padding:20px} .wiz-txt{padding:22px 20px 16px} }

.practice{width:100%; display:flex; flex-direction:column; align-items:center; gap:12px}

.practice .steps{margin:0; width:100%; background:var(--surface)}
.practice .steps li{padding:8px 10px; font-size:12px}
.practice .circ{width:15px; height:15px}
.tl{width:100%; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:12px}
.tl div{display:flex; gap:10px; padding:4px 0} .tl b{min-width:52px; color:var(--muted); font-weight:500}
.tl .due b, .tl .due span{color:var(--red); font-weight:600}

/* toast */
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(150px + env(safe-area-inset-bottom,0px)); z-index:60; background:var(--nav); color:#fff; padding:10px 14px; border-radius:8px; font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,.2); max-width:calc(100% - 32px); animation:fade .15s ease}
@media (max-width:720px){ .toast{bottom:calc(210px + env(safe-area-inset-bottom,0px))} }

/* price-to-win */
.ptw{position:relative}
.ptw svg{width:100%; height:auto; display:block}
.ptw .veil{position:absolute; top:0; bottom:26px; backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); background:rgba(243,248,249,.35); border-left:1px dashed var(--teal); border-right:1px dashed var(--teal); display:grid; place-items:center; text-align:center; font-size:12px; font-weight:600; color:var(--teal-text)}
.slider{width:100%; accent-color:var(--teal)}
.sim{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:end}
@media (max-width:720px){ .sim{grid-template-columns:1fr} }
.sim input[type=text]{font:inherit; font-size:15px; padding:8px 10px; border:1px solid var(--border-strong); border-radius:7px; width:100%; background:var(--surface); color:var(--text)}
.out-price{font-size:26px; font-weight:600; font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important} }

<script>
(function(){

};
function ic(n, cls){ return '<svg class="i'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+(P[n]||'')+'</svg>'; }

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ---------- sample data ---------- */
var BID = { id:'lakemont', name:'Lakemont County Facilities Janitorial Services', short:'Lakemont County Facilities', loc:'Lakemont County, OH', addr:'4 sites across Lakemont County, OH', deadline:'12/04/2026' };

];

/* ---------- state ---------- */
var state;
function fresh(){ return { player:null, played:[], view:'pipeline', wonId:null, filter:'all', guess:null, chat:[], asked:[], scope:'bid', chatOpen:false, lastRevealed:null, seen:{} }; }
state = fresh();
function spent(){ var n=0; state.played.forEach(function(id){ n += (card(id).cost||1); }); return n; }
function left(){ return 3 - spent(); }
function has(id){ return state.played.indexOf(id) > -1; }
function reqMet(c){ return c.req.every(has); }
function cardState(c){
  if (state.guess) return has(c.id) ? 'played' : 'out';
  if (!c.repeat && has(c.id)) return 'played';
  if (c.unreachable) return 'locked';
  if (!reqMet(c)) return 'locked';
  if ((c.cost||1) > left()) return 'out';
  return 'available';
}
function reqText(c){
  if (c.unreachable) return 'Needs 4 cards';
  return 'After ' + c.req.map(function(r){ return card(r).name; }).join(' + ');
}

function statusTag(s){ return '<span class="tag '+s+'">'+(s==='won'?'Won':s==='lost'?'Lost':'Bidding')+'</span>'; }

function renderPipeline(){

  }).join('');
  var f = function(k,l){ return '<button type="button" data-filter="'+k+'" aria-pressed="'+(state.filter===k)+'">'+l+'</button>'; };
  return '<p class="eyebrow">Bid pipeline</p><h1>Summit Building Services</h1>'+

function lockedBlock(id){
  var c = card(id), st = cardState(c);
  var why = c.unreachable ? 'Needs Floor breakdown and Production rates: four cards. Shown in the results email after ISSA.'

  if (id==='chat'){ openChat(true); return; }
  if (s==='played'){ if (SECTIONS[id]){ state.lastRevealed = id; go('bid'); } return; }
  if (s==='locked'){ toast(c.unreachable ? 'Staffing plan needs Floor breakdown and Production rates: four cards. It appears in the results email.' : c.name+' unlocks after '+c.req.map(function(r){return card(r).name;}).join(' + ')+'.'); return; }
  if (s==='out'){ toast(left() ? c.name+' costs '+(c.cost||1)+' cards. You have '+left()+' left.' : 'No cards left. Lock in your guess.'); return; }
  if (id==='won'){ state.filter='won'; go('pipeline'); toast('Choose a won bid to open its live dashboard.'); return; }
  play(id);
}
function play(id, after){
  var c = card(id), steps = STEPS[id] || ['Reading source documents','Extracting details','Tracing every figure to its source'];
  var m = $('#modal');
  m.innerHTML = '<div class="scrim"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="pt"><div class="dlg-b"><h3 id="pt">Playing '+esc(c.name)+'</h3>'+
    '<div class="info">Jain is examining the RFP and your data. Every finding points back to its source.</div><ul class="steps">'+
    steps.map(function(s,i){ return '<li><span class="circ" id="st'+i+'"></span>'+esc(s)+'</li>'; }).join('')+'</ul><div class="bar"><i id="pbar"></i></div></div></div></div>';
  var fast = matchMedia('(prefers-reduced-motion: reduce)').matches, dt = fast ? 120 : 480, i = 0;
  function tick(){
    if (i>0){ var p = $('#st'+(i-1)); p.className='circ ok'; p.innerHTML = ic('check'); }
    if (i<steps.length){ $('#st'+i).className='circ spin'; $('#pbar').style.width = ((i+0.5)/steps.length*100)+'%'; i++; setTimeout(tick, dt); }
    else { $('#pbar').style.width='100%'; setTimeout(function(){
      m.innerHTML=''; state.played.push(id);
      if (after) after(); else { state.lastRevealed = id; go('bid'); }
      toast(c.name+' played. '+left()+' card'+(left()===1?'':'s')+' left.');
    }, dt/2); }
  }
  tick();
}

/* ---------- won dashboards ---------- */
function openWon(id){
  if (state.seen[id]){ state.wonId=id; go('won'); return; }
  if (state.guess){ toast('Your guess is locked.'); return; }
  if (left()<1){ toast('No cards left. Lock in your guess.'); return; }
  var p = PIPE.filter(function(r){return r.id===id;})[0];
  modal('<div class="dlg-b"><h3>Open the live dashboard?</h3><p class="muted" style="margin:0">See margin, wages, payroll and overtime for <b>'+esc(p.name)+'</b>. This plays your <b>See won &amp; active bid</b> card.</p></div>'+
    '<div class="dlg-f"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="button" id="okWon">Play card</button></div>');
  $('#okWon').onclick = function(){ closeModal(); play('won', function(){ state.seen[id]=true; state.wonId=id; go('won'); }); };
}

/* ---------- chat ---------- */
var PROMPTS = {
  bid:[
    { id:'drivers', q:'What drives cost most on this bid?', t:'Cost drivers', a:'Labor. With the county living wage at $17.50/hr plus a $1.80/hr health supplement, labor is roughly 80% of cost. The Courthouse is the most expensive building per square foot because of escorted access to secure areas. Supplies are contractor-furnished, including public restroom paper.' },
    { id:'unusual', q:'What\u2019s unusual about the scope?', t:'Scope', a:'Two things. Every cleaner needs courthouse badging (about 10 business days), and holding areas need escorts, which slows production. The Public Health Center also requires nightly disinfection of exam rooms to healthcare standards, not office standards.' },
    { id:'porters', q:'How many day porters does the RFP require?', t:'Day porters', a:'Three: one each at the Administration Building, Courthouse and Public Health Center, Monday\u2013Friday, 7:00 AM\u20133:30 PM. The library has no day porter requirement.' }
  ],
  org:[
    { id:'avg', q:'What\u2019s our average $/sq ft on won public-sector bids?', t:'Public-sector pricing', a:'Across 6 won public-sector bids since 2023: $2.95 per sq ft per year on average, ranging from $2.60 to $3.40. Your two public-sector losses were both priced above $3.30.' },
    { id:'franklin', q:'Why did we lose Franklin Park Charter Schools?', t:'Franklin Park', a:'You bid $2.62/sq ft; the award went to $2.41/sq ft. Your staffing plan carried about 12% more night hours than the RFP\u2019s frequencies required.' }
  ]
};
function renderChat(){
  var b = $('#chatBody');
  var msgs = '<div class="msg"><div class="who2">Jain</div><div class="ttl">Ask Jain</div><div class="tx">Each question costs one card. Pick one below, about this bid or across your organization.</div></div>';
  state.chat.forEach(function(m){
    if (m.role==='you') msgs += '<div class="msg you"><div class="who2">You</div><div class="tx">'+esc(m.text)+'</div></div>';
    else if (m.typing) msgs += '<div class="msg"><div class="who2">Jain</div><div class="typing" aria-label="Jain is typing"><span></span><span></span><span></span></div></div>';
    else msgs += '<div class="msg"><div class="who2">Jain</div><div class="ttl">'+esc(m.title)+'</div><div class="tx">'+esc(m.text)+'</div></div>';
  });
  b.innerHTML = msgs; b.scrollTop = b.scrollHeight;
  $('#chatScope').innerHTML = '<button type="button" data-scope="bid" aria-pressed="'+(state.scope==='bid')+'">Just to this bid</button><button type="button" data-scope="org" aria-pressed="'+(state.scope==='org')+'">Across your organization</button>';
  $('#prompts').innerHTML = PROMPTS[state.scope].map(function(p){
    var asked = state.asked.indexOf(p.id)>-1, dis = asked || state.guess || left()<1;
    return '<button type="button" class="prompt" data-ask="'+p.id+'"'+(dis?' disabled':'')+'><span>'+esc(p.q)+'</span><span class="c">'+(asked?'Asked':'1 card')+'</span></button>';
  }).join('');
  document.body.classList.toggle('chat-open', state.chatOpen);
}
function openChat(open){ state.chatOpen = open; if (open && state.view==='bid') state.scope='bid'; renderChat(); }
function ask(pid){
  if (state.guess) return;
  if (left()<1){ toast('No cards left. Lock in your guess.'); return; }
  var p = PROMPTS.bid.concat(PROMPTS.org).filter(function(x){return x.id===pid;})[0];
  state.played.push('chat'); state.asked.push(pid);
  state.chat.push({role:'you', text:p.q}); var typing = {role:'jain', typing:true}; state.chat.push(typing);
  renderChat(); renderTray();
  setTimeout(function(){ typing.typing=false; typing.title=p.t; typing.text=p.a; renderChat(); toast('Chat card played. '+left()+' card'+(left()===1?'':'s')+' left.'); }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 50 : 900);
}

/* ---------- margin sim ---------- */
function parseMoney(v){ var n = parseInt(String(v).replace(/[^0-9]/g,''),10); return isNaN(n)?0:n; }
function wireSim(){
  var c = $('#simCost'); if (!c) return;
  var m = $('#simM');
  if (state.simCost) c.value = money(state.simCost);
  if (state.simM) m.value = state.simM;
  function upd(){
    var cost = parseMoney(c.value), mg = +m.value; state.simCost = cost; state.simM = mg;
    $('#simMv').textContent = mg+'%';
    if (!cost){ $('#simOut').textContent='\u2014'; $('#simSf').textContent=''; return; }
    var price = cost/(1-mg/100); state.simPrice = price;
    $('#simOut').textContent = money(price)+' / yr';
    $('#simSf').textContent = has('xray') ? '$'+(price/SQFT).toFixed(2)+' per sq ft per year' : '';
  }
  c.oninput = function(){ var n = parseMoney(c.value); c.value = n ? money(n) : ''; upd(); };
  m.oninput = upd; upd();
  $('#simUse').onclick = function(){ if (state.simPrice) openGuess(Math.round(state.simPrice)); else toast('Enter an estimated annual cost first.'); };
}

/* ---------- modals ---------- */
var lastFocus;
function modal(inner, wide){
  lastFocus = document.activeElement;
  $('#modal').innerHTML = '<div class="scrim" data-scrim><div class="dlg'+(wide?' wide':'')+'" role="dialog" aria-modal="true">'+inner+'</div></div>';
  var f = $('#modal').querySelector('input, button.primary, button'); if (f) f.focus();
}
function closeModal(){ $('#modal').innerHTML=''; if (lastFocus && lastFocus.focus) lastFocus.focus(); }

function openCheckin(){
  modal('<div class="dlg-b"><p class="eyebrow">ISSA 2026</p><h3>The Price Is Right, Jain edition</h3><p class="muted" style="margin:0">Guess the winning annual bid on a live janitorial RFP. Check in so we can send your results after the show.</p>'+
    '<div class="f"><label for="ciName">Name</label><input type="text" id="ciName" autocomplete="name"></div>'+
    '<div class="f"><label for="ciCo">Company</label><input type="text" id="ciCo" autocomplete="organization"></div>'+
    '<div class="f"><label for="ciEmail">Work email</label><input type="email" id="ciEmail" autocomplete="email" placeholder="you@company.com"></div><div class="err" id="ciErr"></div>'+
    '<p class="demo-note">Demo with sample data. Nothing you enter here is saved or sent.</p></div>'+
    '<div class="dlg-f"><button class="btn ghost left" type="button" id="ciSkip">Skip for demo</button><button class="btn primary" type="button" id="ciGo">Start playing</button></div>');
  $('#ciGo').onclick = function(){
    var n=$('#ciName').value.trim(), e=$('#ciEmail').value.trim();
    if (!n){ $('#ciErr').textContent='Enter your name to play.'; $('#ciName').focus(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){ $('#ciErr').textContent='Enter a work email. Results are sent there after ISSA.'; $('#ciEmail').focus(); return; }
    state.player = {name:n, company:$('#ciCo').value.trim(), email:e}; closeModal(); render(); openWizard(0);
  };
  $('#ciSkip').onclick = function(){ state.player = {name:'Guest player', company:'', email:''}; closeModal(); render(); openWizard(0); };
  $('#modal').querySelector('.dlg').addEventListener('keydown', function(ev){ if (ev.key==='Enter') $('#ciGo').click(); });
}

function openGuess(prefill){
  var chips = state.played.length ? state.played.map(function(id){ return '<span class="chip">'+esc(card(id).name)+'</span>'; }).join('') : '<span class="muted small">No cards played. Pure instinct.</span>';
  modal('<div class="dlg-b"><h3>What\u2019s the winning annual bid?</h3><p class="muted" style="margin:0">'+esc(BID.name)+'. Closest without going over wins.</p>'+
    '<div class="money"><span>$</span><input type="text" id="gIn" inputmode="numeric" autocomplete="off" aria-label="Your guess in dollars per year" placeholder="0"><span class="per muted">/ yr</span></div><div class="err" id="gErr"></div>'+
    '<p class="small muted" style="margin:6px 0 0">Cards played</p><div class="played-list">'+chips+'</div>'+
    (left()>0?'<p class="small muted" style="margin:12px 0 0">You still have '+left()+' card'+(left()===1?'':'s')+'. Once you lock in, the round ends.</p>':'')+'</div>'+
    '<div class="dlg-f"><button class="btn" type="button" data-close>Keep playing</button><button class="btn primary" type="button" id="gGo">Lock in guess</button></div>');
  var g = $('#gIn');
  if (prefill) g.value = prefill.toLocaleString('en-US');
  g.oninput = function(){ var n = parseMoney(g.value); g.value = n ? n.toLocaleString('en-US') : ''; };
  g.addEventListener('keydown', function(ev){ if (ev.key==='Enter') $('#gGo').click(); });
  $('#gGo').onclick = function(){
    var n = parseMoney(g.value);
    if (n < 10000){ $('#gErr').textContent = 'Enter an annual price, like 1,250,000.'; g.focus(); return; }
    state.guess = n; openChat(false); closeModal(); render(); openLocked();
  };
}
function openLocked(){
  var em = state.player && state.player.email ? esc(state.player.email) : 'your inbox';
  modal('<div class="dlg-b" style="text-align:center; padding:32px 28px"><div class="bigcheck" style="margin:0 auto 14px">'+ic('check')+'</div><h3>Guess locked</h3><div class="amount">'+money(state.guess)+' / yr</div>'+
    '<p class="muted" style="margin:6px auto 0; max-width:40ch">The winning price stays secret until ISSA ends. We\u2019ll send '+em+' how close you were, plus the top 3.</p></div>'+
    '<div class="dlg-f"><button class="btn left" type="button" data-newplayer>New player</button><button class="btn primary" type="button" id="lkMail">Preview results email</button></div>');
  $('#lkMail').onclick = openMail;
}
function openMail(){
  var off = (state.guess - WIN)/WIN*100, over = state.guess > WIN;
  var name = state.player && state.player.name && state.player.name!=='Guest player' ? state.player.name.split(' ')[0] : 'there';
  var to = state.player && state.player.email ? esc(state.player.email) : 'player@company.com';
  modal('<div class="dlg-b"><div class="mail"><div class="mail-h"><b>Jain</b> to '+to+'<br>Subject: <b>Your Price Is Right results are in</b></div><div class="mail-b">'+
    '<h4>Hi '+esc(name)+', here\u2019s how you did at ISSA</h4><p class="muted" style="margin:0">'+esc(BID.name)+'</p>'+
    '<div class="res"><div><span>Winning bid</span><span class="v">'+money(WIN)+' / yr</span></div>'+
    '<div><span>Your guess</span><span class="v">'+money(state.guess)+' \u00b7 '+Math.abs(off).toFixed(1)+'% '+(off>=0?'over':'under')+'</span></div>'+
    '<div><span>Your rank</span><span class="v">'+(over?'Over the winning bid, not ranked':'#14 of 212')+'</span></div>'+
    '<div><span>Jain\u2019s estimate</span><span class="v" style="color:var(--teal-text)">'+money(JAIN_EST)+' \u00b7 within '+((JAIN_EST-WIN)/WIN*100).toFixed(1)+'%</span></div></div>'+
    '<p class="small muted" style="margin:0 0 6px">Top 3</p><div class="podium"><div><b>1st</b>[Winner name]<br><span class="muted">0.3% under</span></div><div><b>2nd</b>[Winner name]<br><span class="muted">0.9% under</span></div><div><b>3rd</b>[Winner name]<br><span class="muted">1.6% under</span></div></div>'+
    '<button class="btn primary" type="button" data-inert style="width:100%; justify-content:center">See how Jain priced it</button></div></div>'+
    '<p class="demo-note">Preview with sample results. Real results are sent after ISSA; rank and winners are placeholders.</p></div>'+
    '<div class="dlg-f"><button class="btn" type="button" data-close>Close</button></div>', true);
}

/* ---------- how-to-play wizard ---------- */
function miniCard(id, style, cls){
  var c = card(id);
  return '<span class="card'+(cls||'')+'" style="'+style+'" aria-hidden="true"><span class="top">'+ic(c.icon)+'<span class="cost">1 card</span></span><span class="nm">'+esc(c.name)+'</span><span class="bl">'+esc(c.blurb)+'</span></span>';
}
var WIZ = [
  { t:'Guess the winning bid', p:'One live RFP in the pipeline is the mystery bid. Your job: guess the annual price that wins it.',
    li:['You\u2019re bidding as Summit Building Services, a sample BSC','The mystery bid is marked <b>Guess this one</b>'],
    art:function(){ return '<div class="mini-row"><div class="fac">'+esc(BID.short)+'<span class="guess-me">Guess this one</span></div><div class="fac-sub">Government, 4 buildings</div><div class="r2">'+statusTag('bidding')+'<b>???</b></div></div>'; } },
  { t:'You get three cards', p:'Each card opens one Jain feature and reveals part of the picture. Spend them wisely.',
    li:['X-Ray, floor plans, production rates, risks and more','Your hand is at the bottom of the screen'],
    art:function(){ return '<div class="fan">'+miniCard('xray','left:0; transform:rotate(-10deg)')+miniCard('bsc','left:40px; top:4px; transform:rotate(-1deg)')+miniCard('chat','left:82px; transform:rotate(8deg)')+'</div>'; } },
  { t:'Some cards unlock others', p:'Play X-Ray to unlock the floor breakdown. Play BSC Assessment to unlock production rates.',
    li:['The best information takes four cards, and you only get three','Choose a path before you start playing'],
    art:function(){ var a = ic('arrow'); return '<div class="chain"><div class="ln"><span class="pill base">X-Ray</span>'+a+'<span class="pill unl">Floor breakdown</span></div><div class="ln"><span class="pill base">BSC Assessment</span>'+a+'<span class="pill unl">Production rates</span></div><div class="ln"><span class="pill no">Staffing plan: needs 4 cards</span></div></div>'; } },
  { t:'Chat and live dashboards', p:'Some cards can be played more than once. Each use costs one card.',
    li:['<b>Chat:</b> ask Jain one question, about this bid or across your organization','<b>See won &amp; active bid:</b> open the live dashboard of a won bid, with margin, wages, payroll and overtime'],
    art:function(){ return '<div class="mini-chat"><div class="scope"><span>Just to this bid</span><span class="off">Across your organization</span></div><div class="msg you"><div class="who2">You</div><div class="tx">What drives cost most on this bid?</div></div><div class="msg"><div class="who2">Jain</div><div class="ttl">Cost drivers</div><div class="tx">Labor. The county living wage sets the floor, and the courthouse is the priciest building per square foot.</div></div></div>'; } },
  { t:'Try a practice card', p:'Tap the practice card to see how playing a card works. It\u2019s free and doesn\u2019t count toward your three.',
    li:['Jain reads the RFP and traces every finding to its source','The reveal appears on the Bid X-Ray page'],
    art:function(){ return '<div class="practice" id="prac"><button type="button" class="card" id="pracCard" aria-label="Play the practice card: Procurement timeline"><span class="top">'+ic('cal')+'<span class="cost">Practice</span></span><span class="nm">Procurement timeline</span><span class="bl">Key dates for this RFP</span></button><span class="small muted" id="pracHint">Tap to play</span></div>'; },
    init:function(){
      $('#pracCard').onclick = function(){
        var steps = ['Reading the RFP','Extracting key dates','Tracing each date to its page'];
        $('#prac').innerHTML = '<ul class="steps">'+steps.map(function(x,k){ return '<li><span class="circ" id="ps'+k+'"></span>'+x+'</li>'; }).join('')+'</ul>';
        var k = 0, dt = matchMedia('(prefers-reduced-motion: reduce)').matches ? 80 : 420;
        (function tick(){
          if (!$('#prac')) return;
          if (k>0){ var q = $('#ps'+(k-1)); q.className='circ ok'; q.innerHTML=ic('check'); }
          if (k<steps.length){ $('#ps'+k).className='circ spin'; k++; setTimeout(tick, dt); }
          else setTimeout(function(){ if (!$('#prac')) return; $('#prac').innerHTML = '<div class="tl" role="status"><div><b>Oct 6</b><span>RFP released</span></div><div><b>Nov 18</b><span>Site walk, Administration Building</span></div><div><b>Nov 24</b><span>Q&amp;A closes</span></div><div class="due"><b>Dec 4</b><span>Bid due, 2:00 PM</span></div></div><span class="small muted">Revealed. In the game, that would cost one card.</span>'; }, dt);
        })();
      };
    } },
  { t:'Lock in your guess', p:'Closest guess without going over wins. The winning price stays secret until ISSA ends.',
    li:['Everyone gets an email with how close they were','The top 3 are announced, along with Jain\u2019s own estimate'],
    art:function(){ return '<div style="width:100%"><div class="mini-guess"><span>$</span>1,250,000<span style="font-size:13px">/ yr</span></div><div class="mini-mail">'+ic('mail')+'Results by email after ISSA</div></div>'; } }
];
function openWizard(i){
  i = i||0; var w = WIZ[i], last = i===WIZ.length-1;
  var dots = WIZ.map(function(_,k){ return '<span'+(k===i?' class="on"':'')+'></span>'; }).join('');
  modal('<div class="wiz"><div class="wiz-art">'+w.art()+'</div><div class="wiz-txt"><div class="n">How to play \u00b7 '+(i+1)+' of '+WIZ.length+'</div><h3 id="wzT">'+w.t+'</h3><p>'+w.p+'</p><ul>'+w.li.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div></div>'+
    '<div class="dlg-f"><div class="dots" aria-hidden="true">'+dots+'</div>'+
    (i>0 ? '<button class="btn" type="button" id="wzBack">Back</button>' : '<button class="btn ghost" type="button" id="wzSkip">Skip</button>')+
    '<button class="btn primary" type="button" id="wzNext">'+(last?'Start playing':'Next')+'</button></div>', true);
  $('#modal').querySelector('.dlg').setAttribute('aria-labelledby','wzT');
  if (w.init) w.init();
  $('#wzNext').focus();
  $('#wzNext').onclick = function(){ if (last) closeModal(); else openWizard(i+1); };
  if ($('#wzBack')) $('#wzBack').onclick = function(){ openWizard(i-1); };
  if ($('#wzSkip')) $('#wzSkip').onclick = closeModal;
  $('#modal').querySelector('.dlg').onkeydown = function(ev){ if (ev.key==='ArrowRight' && !last) openWizard(i+1); if (ev.key==='ArrowLeft' && i>0) openWizard(i-1); };
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('button, tr.row, [data-scrim]');
  if (!t) return;
  if (t.hasAttribute('data-scrim')){ if (e.target===t && state.player) closeModal(); return; }
  if (t.dataset.go){ go(t.dataset.go); return; }
  if (t.dataset.filter){ state.filter = t.dataset.filter; render(); return; }
  if (t.dataset.row){ rowClick(t.dataset.row); return; }
  if (t.dataset.card){ tryCard(t.dataset.card); return; }
  if (t.dataset.play){ tryCard(t.dataset.play); return; }
  if (t.hasAttribute('data-openchat')){ openChat(true); return; }
  if (t.dataset.scope){ state.scope = t.dataset.scope; renderChat(); return; }
  if (t.dataset.ask){ ask(t.dataset.ask); return; }
  if (t.hasAttribute('data-close')){ closeModal(); return; }
  if (t.hasAttribute('data-inert')){ toast('Not part of the game in this demo.'); return; }
  if (t.hasAttribute('data-newplayer')){ reset(); return; }
  if (t.id==='lockIn'){ openGuess(); return; }
  if (t.id==='previewMail'){ openMail(); return; }
  if (t.id==='chatClose'){ openChat(false); return; }
  if (t.id==='howTo'){ if (state.player) openWizard(0); return; }
  if (t.id==='newPlayer'){ if (state.played.length && !state.guess){ modal('<div class="dlg-b"><h3>Start a new player?</h3><p class="muted" style="margin:0">This round\u2019s cards and guess will be cleared.</p></div><div class="dlg-f"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="button" data-newplayer>New player</button></div>'); } else reset(); return; }
});
document.addEventListener('keydown', function(e){
  if (e.key==='Escape'){ if ($('#modal').innerHTML && state.player && !document.querySelector('#pt')) closeModal(); else if (state.chatOpen) openChat(false); }
  if ((e.key==='Enter' || e.key===' ') && e.target.matches && e.target.matches('tr.row')){ e.preventDefault(); rowClick(e.target.dataset.row); }
});
function rowClick(id){
  var p = PIPE.filter(function(r){return r.id===id;})[0];
  if (p.mystery){ go('bid'); return; }
  if (p.status==='won'){ openWon(id); return; }
  toast(p.status==='lost' ? 'Lost bids show price and status only. Ask about them in chat.' : 'This draft isn\u2019t part of the game.');
}
function reset(){ state = fresh(); closeModal(); render(); openCheckin(); }

$('#chatClose').innerHTML = ic('x');
$('#upIc').innerHTML = ic('upload');
$('#sendIc').innerHTML = ic('arrow');
render();
openCheckin();
})();
</script>
</body>
